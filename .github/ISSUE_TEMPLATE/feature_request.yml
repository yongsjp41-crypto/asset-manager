name: 功能建议
description: 提出一个新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先说明要解决的**问题**，再说你设想的**方案**。这个项目刻意保持零依赖、零构建，涉及引入新库的建议需要额外说明体积与许可证。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前在哪一步卡住了？谁在什么场景下会遇到？
      placeholder: 我们每年盘点 300 件资产，现在按位置分批盘点时……
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望界面或行为变成什么样
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 现在的临时绕过办法，或其他工具的做法
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: 涉及模块
      options:
        - 资产台账
        - 资产照片
        - 扫码盘点
        - 盘点记录
        - 标签打印 / 模板
        - 人员与权限
        - 备份 / 导入导出
        - 其他
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 确认事项
      options:
        - label: 该建议不要求引入后端服务或 npm 运行时依赖
          required: false
