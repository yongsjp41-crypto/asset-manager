name: Bug 报告
description: 报告一个可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请先搜索已有 Issue，避免重复。

        注意：这是一个纯前端单机工具，很多「数据不见了」的情况源于浏览器清理了 localStorage，而不一定是程序缺陷。请先确认是否发生过清理缓存、切换浏览器或使用无痕模式。
  - type: dropdown
    id: run-mode
    attributes:
      label: 运行方式
      description: 你是怎样打开这个应用的？
      options:
        - 直接双击打开 index.html（file://）
        - 单文件版 资产管理.html
        - 部署在服务器（HTTPS / 域名访问）
        - 本地静态服务（localhost:8000）
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: 浏览器与版本
      description: 例如 Chrome 129 / Edge 128 / Safari 17.4；移动端请注明机型与系统
      placeholder: Chrome 129.0.6668.90，macOS 14.6
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 按顺序写清每一步操作，从打开页面开始
      placeholder: |
        1. 登录 admin 账号
        2. 在「资产台账」新增一条资产，上传照片
        3. 点「保存」
        4. 页面提示……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你认为正确的结果是什么
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么；有报错信息请一并粘贴
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 截图、Console 报错、数据规模（多少条资产）、是否使用了备份恢复等
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: 确认事项
      options:
        - label: 我已确认这不是 docs/SECURITY.md 中「设计限制」列出的行为
          required: true
        - label: 我已尝试在 localStorage 未被清理的环境中复现
          required: false
